name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*" # Trigger on tags like v1.0.0, v2.1.0-beta.1, etc.

jobs:
  publish:
    name: Publish package
    runs-on: ubuntu-latest

    # Required for OIDC authentication with pub.dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Setup Dart (for pub.dev OIDC authentication)
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Publish to pub.dev
        run: dart pub publish --force
